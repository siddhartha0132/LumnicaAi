services:
  - type: web
    name: lumnica-ai-backend
    env: node
    buildCommand: rm -f package-lock.json && npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DEMO_MODE
        value: false
      - key: SUGGEST_PRODUCTS
        value: false
      # Single model for ALL tasks (vision + text)
      - key: NVIDIA_MODEL
        value: meta/llama-3.2-11b-vision-instruct
      # ── API Key — set this as Secret in Render dashboard ──
      # NVIDIA_API_KEY  → set in Render dashboard (Secret)
      # (also accepts NVIDIA_API_KEY_VISION as fallback if already set)
