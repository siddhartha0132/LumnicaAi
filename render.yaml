services:
  - type: web
    name: lumnica-ai-backend
    env: node
    buildCommand: rm -f package-lock.json && npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DEMO_MODE
        value: false
      - key: SUGGEST_PRODUCTS
        value: false
      # Single model for ALL tasks (vision + text) — MoE 3B active params = fast
      - key: NVIDIA_MODEL
        value: nvidia/nemotron-3-nano-omni-30b-a3b-reasoning
      # ── API Key — set in Render dashboard as Secret ──
      # NVIDIA_API_KEY → set in Render dashboard
