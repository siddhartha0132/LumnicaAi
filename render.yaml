services:
  - type: web
    name: lumnica-ai-backend
    env: node
    buildCommand: rm -f package-lock.json && npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DEMO_MODE
        value: false
      - key: SUGGEST_PRODUCTS
        value: false
      # Vision model — skin image analysis
      - key: NVIDIA_VISION_MODEL
        value: meta/llama-3.2-11b-vision-instruct
      # Text model — quiz generation & result analysis
      - key: NVIDIA_TEXT_MODEL
        value: meta/llama-3.1-8b-instruct
      # ── API Key — set in Render dashboard as Secret ──
      # NVIDIA_API_KEY_VISION → used automatically (no new key needed)
